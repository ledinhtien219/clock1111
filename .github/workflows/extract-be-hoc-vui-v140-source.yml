name: Extract Be Hoc Vui 1.4.0 Source

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch base app bundle
        shell: bash
        run: |
          git fetch origin build-be-hoc-vui-1-1-1 --depth=1
          git checkout FETCH_HEAD -- .build/behocvui .build/layout-v130

      - name: Restore source
        shell: bash
        run: |
          mkdir -p behocvui
          cat .build/behocvui/part*.b64 > /tmp/behocvui.b64
          base64 -d /tmp/behocvui.b64 > /tmp/behocvui.tar.gz
          tar -xzf /tmp/behocvui.tar.gz -C behocvui
          base64 -d .build/layout-v130/layout.patch.gz.b64 > /tmp/layout-v130.patch.gz
          gzip -dc /tmp/layout-v130.patch.gz > /tmp/layout-v130.patch
          cd behocvui
          patch -p1 < /tmp/layout-v130.patch
          cd ..
          cat .build/v140bundle2/part*.b64 > /tmp/v140-files.tar.xz.b64
          base64 -d /tmp/v140-files.tar.xz.b64 > /tmp/v140-files.tar.xz
          tar -xJf /tmp/v140-files.tar.xz -C behocvui
          perl -0pi -e 's/\@Override\s*\n\s*\@Override/\@Override/g' behocvui/app/src/main/java/com/behocvui/game/KidsGameView.java

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: BeHocVui-1.4.0-source
          path: |
            behocvui/app/src/main/java/com/behocvui/game/KidsGameView.java
            behocvui/app/src/main/java/com/behocvui/game/QuestionEngine.java
            behocvui/app/src/main/java/com/behocvui/game/SpeechHelper.java
            behocvui/app/build.gradle.kts
          if-no-files-found: error
          retention-days: 1
