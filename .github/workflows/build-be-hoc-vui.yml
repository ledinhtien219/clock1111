name: Build Be Hoc Vui APK

on:
  push:
    branches: [build-be-hoc-vui-1-1-1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        continue-on-error: true
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "platform-tools" || true

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Restore app source
        shell: bash
        run: |
          rm -rf behocvui
          mkdir -p behocvui
          cat .build/behocvui/part*.b64 > /tmp/behocvui.b64
          base64 -d /tmp/behocvui.b64 > /tmp/behocvui.tar.gz
          tar -xzf /tmp/behocvui.tar.gz -C behocvui

      - name: Build APK and capture log
        shell: bash
        run: |
          set +e
          cd behocvui
          gradle --no-daemon assembleDebug 2>&1 | tee ../build.log
          status=${PIPESTATUS[0]}
          echo "$status" > ../build.exit
          exit 0

      - name: Prepare result
        if: always()
        shell: bash
        run: |
          rm -rf build-output
          mkdir -p build-output
          if [ -f behocvui/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp behocvui/app/build/outputs/apk/debug/app-debug.apk build-output/BeHocVui-1.1.1.apk
            echo "SUCCESS" > build-output/status.txt
          else
            echo "FAILED" > build-output/status.txt
            if [ -f build.log ]; then
              cp build.log build-output/build-error.txt
            else
              printf 'Build stopped before Gradle produced a log.\nJava:\n' > build-output/build-error.txt
              java -version >> build-output/build-error.txt 2>&1 || true
              printf '\nSDK root: %s\n' "${ANDROID_SDK_ROOT:-}" >> build-output/build-error.txt
              printf 'Gradle:\n' >> build-output/build-error.txt
              gradle --version >> build-output/build-error.txt 2>&1 || true
            fi
          fi

      - name: Commit build result
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build-output
          git commit -m "Build Be Hoc Vui result [skip ci]" || true
          git push origin HEAD:build-be-hoc-vui-1-1-1

      - name: Upload APK artifact
        if: ${{ hashFiles('build-output/BeHocVui-1.1.1.apk') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: BeHocVui-1.1.1-APK
          path: build-output/BeHocVui-1.1.1.apk
          retention-days: 7
