name: Inspect Be Hoc Vui 1.3 source

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        shell: bash
        run: |
          mkdir -p behocvui
          cat .build/behocvui/part*.b64 > /tmp/behocvui.b64
          base64 -d /tmp/behocvui.b64 > /tmp/behocvui.tar.gz
          tar -xzf /tmp/behocvui.tar.gz -C behocvui
          base64 -d .build/layout-v130/layout.patch.gz.b64 > /tmp/layout-v130.patch.gz
          gzip -dc /tmp/layout-v130.patch.gz > /tmp/layout-v130.patch
          cd behocvui
          patch -p1 < /tmp/layout-v130.patch
          perl -0pi -e 's/@Override\s*\n\s*@Override/@Override/g' app/src/main/java/com/behocvui/game/KidsGameView.java
      - name: Collect source
        run: |
          mkdir inspect
          cp behocvui/app/src/main/java/com/behocvui/game/KidsGameView.java inspect/
          cp behocvui/app/src/main/java/com/behocvui/game/QuestionEngine.java inspect/
          cp behocvui/app/src/main/java/com/behocvui/game/SpeechHelper.java inspect/
          cp behocvui/app/src/main/java/com/behocvui/game/MainActivity.java inspect/ 2>/dev/null || true
          cp behocvui/app/build.gradle.kts inspect/
      - uses: actions/upload-artifact@v4
        with:
          name: BeHocVui-1.3-source-inspect
          path: inspect
          retention-days: 1
