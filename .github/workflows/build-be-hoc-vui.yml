name: Build Be Hoc Vui APK

on:
  push:
    branches: [build-be-hoc-vui-1-1-1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 37
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;37.0.0" "platform-tools"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Restore app source
        shell: bash
        run: |
          mkdir -p behocvui
          cat > /tmp/behocvui.b64 <<'APP_ARCHIVE'
[... ELLIPSIZATION ...]= [?2004h[?2004l in tool payload to save tokens
APP_ARCHIVE
          base64 -d /tmp/behocvui.b64 > /tmp/behocvui.tar.gz
          tar -xzf /tmp/behocvui.tar.gz -C behocvui

      - name: Build debug APK
        working-directory: behocvui
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: cp behocvui/app/build/outputs/apk/debug/app-debug.apk BeHocVui-1.1.1.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BeHocVui-1.1.1-APK
          path: BeHocVui-1.1.1.apk
          if-no-files-found: error
          retention-days: 7
