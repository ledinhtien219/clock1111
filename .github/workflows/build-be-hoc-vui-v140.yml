name: Build Be Hoc Vui 1.4.0 APK

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch base app bundle
        shell: bash
        run: |
          git fetch origin build-be-hoc-vui-1-1-1 --depth=1
          git checkout FETCH_HEAD -- .build/behocvui .build/layout-v130

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Restore 1.3 source
        shell: bash
        run: |
          mkdir -p behocvui
          cat .build/behocvui/part*.b64 > /tmp/behocvui.b64
          base64 -d /tmp/behocvui.b64 > /tmp/behocvui.tar.gz
          tar -xzf /tmp/behocvui.tar.gz -C behocvui
          base64 -d .build/layout-v130/layout.patch.gz.b64 > /tmp/layout-v130.patch.gz
          gzip -dc /tmp/layout-v130.patch.gz > /tmp/layout-v130.patch
          cd behocvui
          patch -p1 < /tmp/layout-v130.patch

      - name: Apply 1.4.0 redesign and math
        shell: bash
        run: |
          cat .build/v140/xz*.b64 > /tmp/v140.patch.xz.b64
          base64 -d /tmp/v140.patch.xz.b64 > /tmp/v140.patch.xz
          xz -dc /tmp/v140.patch.xz > /tmp/v140.patch
          cd behocvui
          patch -p1 < /tmp/v140.patch
          perl -0pi -e 's/\@Override\s*\n\s*\@Override/\@Override/g' app/src/main/java/com/behocvui/game/KidsGameView.java

      - name: Compile APK
        working-directory: behocvui
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          test -s behocvui/app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging behocvui/app/build/outputs/apk/debug/app-debug.apk | head -n 8
          cp behocvui/app/build/outputs/apk/debug/app-debug.apk BeHocVui-1.4.0.apk
          sha256sum BeHocVui-1.4.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BeHocVui-1.4.0-APK
          path: BeHocVui-1.4.0.apk
          if-no-files-found: error
          retention-days: 7
